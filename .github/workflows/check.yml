name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Qt/QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtdeclarative5-dev \
            qtdeclarative5-dev-tools qttools5-dev-tools pkg-config

      - name: No private keys in git
        run: |
          if git ls-files | grep -qE '(^|/)keys/|^deploy/factory_test/run\.sh$'; then
            echo "errore: file sensibile tracciato da git" >&2
            exit 1
          fi

      - name: FFmpeg library checksums
        run: cd third_party/ffmpeg && sha256sum -c SHA256SUMS

      - name: Script syntax
        run: |
          for f in build.sh deploy/run.sh deploy/factory_test/run.sh.example scripts/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: QML lint
        run: qmllint qml/*.qml

      - name: Translation checks
        run: python3 tests/check_translations.py

      - name: Settings migration
        run: sh tests/test_settings_migration.sh

      - name: Log redaction
        run: |
          g++ -std=c++17 -fPIC tests/test_redact.cpp src/redact.cpp \
            $(pkg-config --cflags --libs Qt5Core) -o /tmp/test_redact
          /tmp/test_redact

      - name: Server URL normalization
        run: |
          g++ -std=c++17 -fPIC tests/test_serverurl.cpp src/serverurl.cpp \
            $(pkg-config --cflags --libs Qt5Core Qt5Network) -o /tmp/test_serverurl
          /tmp/test_serverurl

      - name: TS demux safety
        run: |
          g++ -std=c++17 -fPIC -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/test_tsdemux.cpp src/tsdemux.cpp -o /tmp/test_tsdemux
          /tmp/test_tsdemux

      - name: Discovery address validation
        run: |
          g++ -std=c++17 -fPIC -Isrc tests/test_discovery_address.cpp \
            $(pkg-config --cflags --libs Qt5Core Qt5Network) -o /tmp/test_discovery_address
          /tmp/test_discovery_address

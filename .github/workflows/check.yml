name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Qt/QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtdeclarative5-dev \
            qtdeclarative5-dev-tools qttools5-dev-tools pkg-config

      - name: No private keys in git
        run: |
          if git ls-files | grep -qE '(^|/)keys/|^deploy/factory_test/run\.sh$'; then
            echo "errore: file sensibile tracciato da git" >&2
            exit 1
          fi
          if git log --all --name-only --pretty=format: | \
             grep -qE '(^|/)keys/|^deploy/factory_test/run\.sh$'; then
            echo "errore: file sensibile nella storia git" >&2
            exit 1
          fi
          # Match real PEM headers only, not the pattern text in this workflow
          # or in the release secret gate.
          if git rev-list --all | while read -r commit; do
               git grep -I -l -E '^-----BEGIN [A-Z ]*PRIVATE KEY-----' "$commit" 2>/dev/null || true
             done | grep -q .; then
            echo "errore: chiave privata nella storia git" >&2
            exit 1
          fi

      - name: FFmpeg library checksums
        run: cd third_party/ffmpeg && sha256sum -c SHA256SUMS

      - name: Script syntax
        run: |
          for f in build.sh deploy/run.sh deploy/factory_test/run.sh.example scripts/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: QML lint
        run: qmllint qml/*.qml

      - name: Translation checks
        run: python3 tests/check_translations.py

      - name: Settings migration
        run: sh tests/test_settings_migration.sh

      - name: Log redaction
        run: |
          OUT="$(mktemp "$RUNNER_TEMP/test_redact.XXXXXX")"
          g++ -std=c++17 -fPIC tests/test_redact.cpp src/redact.cpp \
            $(pkg-config --cflags --libs Qt5Core) -o "$OUT"
          "$OUT"
          rm -f "$OUT"

      - name: Server URL normalization
        run: |
          OUT="$(mktemp "$RUNNER_TEMP/test_serverurl.XXXXXX")"
          g++ -std=c++17 -fPIC tests/test_serverurl.cpp src/serverurl.cpp \
            $(pkg-config --cflags --libs Qt5Core Qt5Network) -o "$OUT"
          "$OUT"
          rm -f "$OUT"

      - name: Input map
        run: |
          OUT="$(mktemp "$RUNNER_TEMP/test_inputmap.XXXXXX")"
          g++ -std=c++17 -fPIC -Isrc tests/test_inputmap.cpp src/inputmap.cpp \
            $(pkg-config --cflags --libs Qt5Core) -o "$OUT"
          "$OUT"
          rm -f "$OUT"

      - name: TS demux safety
        run: |
          OUT="$(mktemp "$RUNNER_TEMP/test_tsdemux.XXXXXX")"
          g++ -std=c++17 -fPIC -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc tests/test_tsdemux.cpp src/tsdemux.cpp -o "$OUT"
          "$OUT"
          rm -f "$OUT"

      - name: Discovery address validation
        run: |
          OUT="$(mktemp "$RUNNER_TEMP/test_discovery_address.XXXXXX")"
          g++ -std=c++17 -fPIC -Isrc tests/test_discovery_address.cpp \
            $(pkg-config --cflags --libs Qt5Core Qt5Network) -o "$OUT"
          "$OUT"
          rm -f "$OUT"
